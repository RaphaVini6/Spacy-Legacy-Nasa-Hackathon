name: demo

# docker compose up --build
# site: http://localhost:8090   api docs (Development only): http://localhost:5090/scalar
# ports differ from the full project (8080 / 5050) so both can run at the same time

# the .NET image has no curl, so the health check just opens a TCP connection to the app port
x-dotnet-health: &dotnet-health
  test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 15s

services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    ports:
      - "${BACKEND_PORT:-5090}:8080"
    healthcheck: *dotnet-health
    restart: unless-stopped
